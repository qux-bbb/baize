[package]
name = "baize-agent"
version = "0.1.0"
edition = "2021"
description = "Baize (白泽) - Rust Agent"

[dependencies]
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
async-stream = "0.3"
tokio-stream = "0.1"
notify = "7"
futures = "0.3"
windows-service = "0.7"

[dependencies.windows]
version = "0.58"
features = ["Win32_System_Diagnostics_Etw", "Win32_Foundation", "Win32_System_Time", "Win32_System_EventLog", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_System_Threading"]

[build-dependencies]
tonic-build = "0.12"
