[package]
name = "baize-agent"
version = "0.1.0"
edition = "2021"
description = "Baize (白泽) EDR - Rust Agent"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
async-stream = "0.3"
tokio-stream = "0.1"
notify = "7"
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"
